name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen 2.38.0
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Fix objectVersion for Xcode 15.4
        run: |
          sed -i "" "s/objectVersion = 77/objectVersion = 60/g" M3U8Downloader.xcodeproj/project.pbxproj

      - name: Build app
        run: |
          xcodebuild build \
            -project M3U8Downloader.xcodeproj \
            -scheme M3U8Downloader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO


      - name: Debug app bundle structure
        run: |
          find build/Build/Products/Release-iphoneos/M3U8Downloader.app -maxdepth 2 -type d
          ls -la build/Build/Products/Release-iphoneos/M3U8Downloader.app/PlugIns/ 2>/dev/null || echo No PlugIns directory
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/M3U8Downloader.app Payload/
          zip -r M3U8Downloader-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: M3U8Downloader-unsigned
          path: M3U8Downloader-unsigned.ipa
