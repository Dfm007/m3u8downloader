<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 340px; padding: 12px; font-family: -apple-system; }
        h3 { margin: 0 0 8px; }
        .url-list { max-height: 300px; overflow-y: auto; }
        .url-item { padding: 8px; background: #f5f5f5; margin-bottom: 6px; border-radius: 6px; }
        .url-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; color: #1a1a1a; word-break: break-all; }
        .url-link { font-size: 11px; color: #666; word-break: break-all; }
        .empty { color: #888; font-size: 12px; padding: 8px 0; }
    </style>
</head>
<body>
    <h3>Detected m3u8</h3>
    <div id="urls" class="url-list"></div>
    <script src="popup.js"></script>
</body>
</html>
